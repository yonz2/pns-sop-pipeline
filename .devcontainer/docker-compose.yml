services:
  workspace:
    build:
      context: ../document-pipeline
      dockerfile: Dockerfile
    image: pns-sop-pipeline:dev
    init: true

    # The image's entrypoint is the one-shot CLI (render / render-all / ...).
    # A dev container must stay alive, so wrap the CLI in a shell and idle.
    # A one-off render overrides `command`, which becomes the script for `sh -c`.
    entrypoint: ["/bin/sh", "-c"]
    command: ["while sleep 1000; do :; done"]

    working_dir: /workspaces/pns-sop-pipeline
    volumes:
      - ..:/workspaces/pns-sop-pipeline

    # Rendered output lands in the bind-mounted ./out so it survives the
    # container. DOCS_DIR is the default `render-all` walks when no path is
    # given, so it points at sop/ -- the documents -- and not at the repository
    # root. Pointed at the root, a bare `render-all` also rendered
    # docs/git-workflow.md and docs/retention.md through the department's
    # official form, producing project notes dressed as approved procedures.
    environment:
      DOCS_DIR: /workspaces/pns-sop-pipeline/sop
      OUT_DIR: /workspaces/pns-sop-pipeline/out
