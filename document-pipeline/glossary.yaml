# =====================================================================
# glossary.yaml - the closed vocabulary of the laboratory SOP corpus
# =====================================================================
#
# Revision 0.1, 1 September 2026. DRAFT - for correction by the department,
# not for use as an authority.
#
# WHAT THIS FILE IS
#   The fixed vocabulary of the SOP documents: section headings, form field
#   names, the approval block, status values, positions and units. These terms
#   are rendered bilingually in the template and therefore NEVER reach a
#   translator. See R1b-translation-pipeline.md section 3.1.
#
#   That single decision removes the entire class of failure in which a machine
#   helpfully renames "Kode Butir Kegiatan" into something an auditor cannot
#   find.
#
# WHAT THIS FILE IS NOT
#   It is not a dictionary and it is not for body prose. Body prose is the only
#   thing the pipeline translates.
#
# THE ENGLISH SIDE IS PROVISIONAL
#   Several of these are terms of art in the PLP credit system. An outside
#   adviser must not invent them. Every entry carries a "status" field; every
#   entry marked needs_pns is a blank the department fills, not a suggestion to
#   be accepted quietly. See open_questions at the end of this file.
#
# HOW A CONSUMING PIPELINE USES IT
#   1. Build a lookup id -> term. Any occurrence of a term's "id" string in the
#      source is a protected token (check 4 of R1b section 6).
#   2. Build a lookup key -> (id, en). The renderer emits headings and field
#      labels from this, never from the translator output.
#   3. Build a set of "en" strings. If one appears in the translated body where
#      the source had the matching "id", the model has translated a field name
#      that should have been protected (check 5).
#   4. protected_patterns and protected_literals extend the same protection to
#      identifiers and proper names, which have no bilingual pair.
#
# ---------------------------------------------------------------------

meta:
  version: "0.1"
  status: draft
  date: "2026-09-01"
  source_of_record: id
  authority: "The department. This file records what an adviser could read from the corpus; it does not settle anything."
  derived_from:
    - "input-Poloines/from_Kuwat_260826/II.A.12.b. Menyusun SOP Pengoperasian (six .docx documents)"
    - "document-pipeline/templates/build-sop-template.js (the rendered form)"
    - "preparation/D-deliverable-drafts/R1-drafts/ (the nine Tier 1 scaffolds)"
    - "preparation/D-deliverable-drafts/R1b-translation-pipeline.md (the specification)"
  term_count_note: >-
    R1b section 3.1 estimated "perhaps forty terms". The count here is 61,
    because the corpus carries two section vocabularies (the operating SOP and
    the management SOP) and because the eleven-row activity record is itself a
    small form. The set is still closed and still small enough to confirm in one
    sitting.

# How a term is put on the page. The renderer owns this; the translator never
# sees it.
rendering:
  bilingual_pattern: "{id} / {en}"
  bilingual_example: "## 1. Tujuan / Purpose"
  protected_pattern: "{id}"
  protected_note: >-
    A term with translate: false is printed in Indonesian only. Its "en" value
    is a gloss for a reader, not a rendering, and belongs in an annex if it is
    used at all.
  separator: " / "
  separator_collision: >-
    The template prints one label as "Referensi / Rujukan" - two Indonesian
    synonyms, not a bilingual pair. The separator therefore already carries two
    meanings in the corpus. See open_questions, item 4.

# The meaning of the "status" field on each term.
term_status:
  confirmed: "The Indonesian is read directly from the corpus AND the English is either self-evident or already used by the department."
  provisional: "The Indonesian is read from the corpus. The English is the adviser's rendering: plausible, defensible, and not authoritative."
  needs_pns: "The Indonesian is read from the corpus. The English is a term of art in the PLP or accreditation system and MUST NOT be invented by an outsider. The value shown is a placeholder to make the blank visible."

# The meaning of the "group" field on each term.
groups:
  section_heading_operating: "Section headings of an operating SOP (II.A.12.b), as the template renders them."
  section_heading_management: "Section headings of a laboratory management procedure, as the R1 Tier 1 scaffolds use them."
  document_control: "The three-row block added by R1-SOP-wireframe section 4. The only structural addition to the form."
  header_band: "The five-line band repeated on every page. It is a page header, not body text."
  activity_record: "The eleven-row Rekaman Kegiatan Pengelolaan Laboratorium table and its column labels."
  approval_block: "The signature block. TWO VARIANTS EXIST IN THE CORPUS - see open_questions, item 1."
  position: "Job titles and grades. Never translated (R1b section 3.2)."
  unit: "Units of quantity used in the activity record."
  status_value: "The lifecycle states of a procedure in the register."
  records_table: "The column headers of the Rekaman / Records table in the R1 Tier 1 scaffolds."

