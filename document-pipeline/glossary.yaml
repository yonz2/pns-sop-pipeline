# ---------------------------------------------------------------------
# PROTECTED TOKENS - identifiers with no bilingual pair.
# Check 4 of R1b section 6: every one of these must appear in the output
# the same number of times, unchanged.
# ---------------------------------------------------------------------
protected_patterns:
  - key: plp_activity_code
    pattern: '\bII\.[A-Z]\.[0-9]{1,2}\.[a-z](\.[a-z])?\b'
    example: "II.A.12.b"
    note: "The credit code. See open_questions, item 2 - the corpus is internally inconsistent about it."

  - key: sop_id_tier1
    pattern: '\bLAB-[A-Z0-9]{3}\b'
    example: "LAB-000"
    note: "The nine laboratory management procedures of R1-SOP-wireframe.md."

  - key: sop_id_tier2
    pattern: '\bIOT-[0-9]{2}\b'
    example: "IOT-02"
    note: "The equipment and system procedures."

  - key: institutional_document_number
    pattern: '\bSOP-[0-9]{2}\.[0-9]{3}-[A-Z]+-[0-9]{4}\b'
    example: "SOP-02.002-BPTI-2020"

  - key: nip_number
    pattern: '\b[0-9]{18}\b'
    example: "an 18-digit NIP"
    note: "Also covered by check 6, the numeric multiset. Named here so a failure reports something a reader understands."

  - key: form_number
    pattern: "[[PNS: the format of No. Formulir is not visible in the corpus - every copy holds a blank]]"
    example: null
    note: "Until the format is known this field cannot be protected by pattern. It is protected in practice because it lives in the header band, which is rendered, not translated."

  - key: architecture_role_slot
    pattern: '\b(Area-Concentrator|IoT-Node|Remote-Site|ESP32-Net|ESP32-Area)-[0-9]{2}\b'
    example: "Area-Concentrator-01"
    note: >-
      Role-slot names from Architecture/ESP32-Area-Concentrator-HLD.md section 3.
      Hyphenated because they are deployed identifiers, not prose - see the
      naming convention in Architecture/HLD.md section 2.

  - key: architecture_synthetic_machine
    pattern: '\bFAS-[A-Za-z]+-[0-9]{2}\b'
    example: "FAS-Press-01"
    note: >-
      Device-naming prefix for the Factory as Code fleet. FAS is a prefix only -
      it is never expanded in prose and never spoken aloud (Architecture/HLD.md
      section 2).

  - key: architecture_subnet
    pattern: '\b192\.168\.1[0-9]\.0/24\b'
    example: "192.168.11.0/24"
    note: "Per-Area subnets. Also covered by check 6, the numeric multiset; named here so a failure reports something a reader understands."

# ---------------------------------------------------------------------
# PROTECTED LITERALS
# Two families. The institutional names have always been here. The
# architecture vocabulary was added on 13 September 2026 because the
# network and equipment procedures (LAB-NET, IOT-01 to IOT-08) use it,
# and a translator will otherwise render "Area Concentrator" as
# "Konsentrator Area" and "Gateway" as "Gerbang" - helpfully, and
# wrongly, because these are names rather than descriptions.
#
# Source of record: the Architecture documents, HLD.md section 2
# (vocabulary) and section 3 (zone inventory). If a definition here and
# a definition there disagree, HLD.md is the one to trust.
#
# Naming convention, from HLD.md section 2, and it applies to every
# entry below: PROSE IS SPACED, DEPLOYED IDENTIFIERS KEEP THEIR HYPHENS.
# So "Area Concentrator" in a sentence, "Area-Concentrators" when naming
# a group, a setup key, a playbook or a host. Names with no hyphenated
# form - "Factory as Code", "Gateway" - are spaced everywhere. Both
# forms are protected, and check 5 must not silently convert one into
# the other.
# ---------------------------------------------------------------------
protected_literals:

  # -- Institution and its units ------------------------------------
  - "Politeknik Negeri Semarang"
  - "Polines"
  - "UPT TIK"
  - "Jurusan Teknik Elektro"
  - "Laboratorium"

  # -- Architecture vocabulary, prose form (HLD.md section 2) --------
  # "Tier" is deliberately NOT in this list - see tier_collision_note.
  - "Zone"
  - "Conduit"
  - "Area Concentrator"
  - "IoT Node"
  - "Gateway"
  - "Network-Layer Forwarder"
  - "Factory as Code"
  - "Digital Twin Core"
  - "Digital Shadow"
  - "Legacy Bench"
  - "Student Bench"
  - "AIoT Laboratory Zone"

  # -- Architecture vocabulary, deployed identifiers -----------------
  - "Area-Concentrators"
  - "IoT-Nodes"
  - "Gateway-bute"
  - "Remote-Site-01"
  - "Factory-Twin"
  - "Admins"
  - "area_concentrators"

  # -- Hosts and peers in the reference implementation ---------------
  - "bute"
  - "bute-iot-gateway"
  - "tiree"
  - "coll"
  - "iona"
  - "arran"
  - "jura"

  # -- Named components and standards --------------------------------
  - "NetBird"
  - "WireGuard"
  - "Mosquitto"
  - "Node-RED"
  - "ThingsBoard"
  - "ESPHome"
  - "Docker Model Runner"
  - "Semaphore"
  - "Ansible"
  - "Raspberry Pi"
  - "ESP32"
  - "ESP8266"
  - "Arduino"
  - "MQTT"
  - "IEC 62443"
  - "IEC 62443-3-2"

protected_literals_note: >-
  Proper names, in three families: the institution and its units; the
  architecture vocabulary defined in the Architecture documents; and the named
  components and standards those documents use. This list grows as documents
  are written; every other equipment model name, hostname and command in a
  procedure is also protected, by category rather than by enumeration - see R1b
  section 3.2.

tier_collision_note: >-
  "Tier" is used for two different things in this project and is therefore not
  protected as a literal until the collision is resolved. Architecture/HLD.md
  section 2 defines a Tier as a device's trust position and function inside a
  zone - never a boundary. R1-SOP-wireframe.md uses Tier 1 and Tier 2 for
  document families, management and equipment. Protecting the bare word would
  freeze whichever usage a document happened to carry. The proposal on the
  table is to rename the document families to "management procedures" and
  "equipment procedures", which is also the language the PLP activity codes
  use, and to leave Tier to the architecture. Until the department decides,
  check 4 does not police the word. Recorded as open question 7.

architecture_vocabulary_note: >-
  The Architecture documents are the source of record for every term in the
  second and third families above, and for how each is written. Two terms carry
  a caution that a translator cannot infer and a reader should not have to. FAS
  is a device-naming prefix only: it is never expanded and never spoken.
  "Digital Shadow" and "Digital Twin" describe a simulated asset only and never
  a twin or shadow of a real machine - that qualifier stays attached in every
  language. See Architecture/Digital-Shadow-Addendum.md.

# ---------------------------------------------------------------------
# OPEN QUESTIONS
# Each of these is a decision for the department. None of them blocks a
# pipeline being built; all of them block a document being signed.
# ---------------------------------------------------------------------
open_questions:

  - id: 1
    question: "Which approval chain governs a new procedure?"
    detail: >-
      The corpus holds two. The 2020 borrowing procedure uses
      Dibuat -> Diperiksa -> Disetujui. The 2025 operating SOPs use
      Verifikator / Disahkan Oleh / Dibuat Oleh. Both variants are in this file
      under a "variant" field so that neither is lost. The template renders the
      2025 form.
    blocks: "The approval block of every rendered document."

  - id: 2
    question: "II.A.12.a or II.A.12.b?"
    detail: >-
      The file names say II.A.12.b. The content of every document says
      II.A.12.a. The template leaves Kode Butir Kegiatan blank rather than
      guessing.
    blocks: "The credit claim."

  - id: 3
    question: "Is there a published English rendering of the PLP terms of art?"
    detail: >-
      Nine entries in this file are marked needs_pns. If the ministry or the
      institution already publishes an English form, that rendering is the
      answer and this file adopts it unchanged. If not, the department chooses
      once, here, and every document afterwards is consistent.
    blocks: "Nothing structural. The English rendering can be built with the placeholders visible - which is preferable to an invented term that then has to be unpicked."

  - id: 4
    question: "How is 'Referensi / Rujukan' rendered bilingually?"
    detail: >-
      Both words are Indonesian, so the slash already means something other
      than a language boundary in the corpus. The proposal in this file is to
      print "Referensi / References" and drop Rujukan, on the ground that the
      two Indonesian words are synonyms and the heading has to stay short.
    blocks: "One heading."

  - id: 5
    question: "Is the status vocabulary correct?"
    detail: >-
      Only "Draf" is taken from work already done. Berlaku, Dalam tinjauan,
      Digantikan and Ditarik are proposed by the adviser and have no basis in
      the corpus, which has no register at all. The department may already have
      words for these states.
    blocks: "The SOP register, LAB-000."

  - id: 6
    question: "Does the department want an English rendering at all, for which documents?"
    detail: >-
      R1b section 1 argues the case from accreditation. That argument is the
      adviser's, and the decision is not. If only the accreditation-facing
      procedures need English, the pipeline runs on a subset and this glossary
      is unchanged.
    blocks: "Nothing. It changes how much is run, not what is built."

  - id: 7
    question: "Do the document families keep the name 'Tier'?"
    detail: >-
      Architecture/HLD.md section 2 defines Tier as a device's trust position
      inside a zone, never a boundary. R1-SOP-wireframe.md uses Tier 1 and
      Tier 2 for document families. Both vocabularies appear in the same
      deliverable set and both appear in LAB-NET. The proposal is to rename the
      document families to "management procedures" and "equipment procedures" -
      the language the activity codes already use - and to leave Tier to the
      architecture. This is an adviser's proposal, raised 13 September 2026.
    blocks: >-
      Nothing structural. It blocks "Tier" being added to protected_literals,
      and it decides one front-matter key and one column heading in
      R1-drafts/README.md.
