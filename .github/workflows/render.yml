name: Render SOP corpus

# The happy path. A reviewed and approved change lands on `main`; the renderer
# then produces the Word and PDF documents from the Markdown source of record.
# Nothing here decides *whether* a document is approved — that is the pull
# request's job, enforced by the branch protection rule on `main`. By the time
# this workflow runs, the decision has already been made and recorded in Git.

on:
  push:
    branches: [main]
    paths:
      - "sop/**"
      - "document-pipeline/**"
      - ".github/workflows/render.yml"
      - ".github/scripts/render-main.sh"

permissions:
  contents: write

concurrency:
  # One render at a time; a newer push supersedes an in-flight one.
  group: render-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      # Full history, so the incremental render can diff the pushed range.
      - name: Check out the source of record
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the renderer image
        uses: docker/build-push-action@v6
        with:
          context: document-pipeline
          load: true
          tags: pns-sop-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Render the procedures this push changed, overlaying them on the previous
      # output so the `rendered` branch stays a complete set. The script falls
      # back to a full render when the renderer changed, when the previous state
      # is unknown, or when the rendered set does not match the sources.
      - name: Render changed procedures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash .github/scripts/render-main.sh "$BEFORE" "$AFTER" pns-sop-pipeline:ci

      - name: List the rendered documents
        run: ls -l out

      # The artifacts and the `rendered` branch now hold the *complete* current
      # set, assembled by the overlay, even though only the changed procedures
      # were freshly rendered.
      # Artifacts are conveniences, not the archive: the `rendered` branch
      # always holds the current set, and it is published before this step. So
      # these uploads are best-effort: `continue-on-error` keeps a full artifact
      # quota from failing a render that already succeeded and was already
      # published. The workflow reports the failure, and the documents are still
      # on the branch.
      #
      # Override the period with the repository variable ARTIFACT_RETENTION_DAYS
      # (Settings -> Secrets and variables -> Actions -> Variables).
      - name: Upload the rendered documents
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sop-rendered
          path: out/*.docx
          if-no-files-found: error
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 14 }}

      - name: Upload the rendered PDFs
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: sop-rendered-pdf
          path: out/*.pdf
          if-no-files-found: error
          retention-days: ${{ vars.ARTIFACT_RETENTION_DAYS || 14 }}
