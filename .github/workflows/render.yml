name: Render SOP corpus

# The happy path. A reviewed and approved change lands on `main`; the renderer
# then produces the Word and PDF documents from the Markdown source of record.
# Nothing here decides *whether* a document is approved — that is the pull
# request's job, enforced by the branch protection rule on `main`. By the time
# this workflow runs, the decision has already been made and recorded in Git.

on:
  push:
    branches: [main]
    paths:
      - "sop/**"
      - "document-pipeline/**"
      - ".github/workflows/render.yml"

permissions:
  contents: write

concurrency:
  # One render at a time; a newer push supersedes an in-flight one.
  group: render-main
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source of record
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the renderer image
        uses: docker/build-push-action@v6
        with:
          context: document-pipeline
          load: true
          tags: pns-sop-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render every procedure
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm \
            -v "$PWD:/docs:ro" -v "$PWD/out:/out" \
            pns-sop-pipeline:ci render-all /docs/sop

      - name: List the rendered documents
        run: ls -l out

      - name: Upload the rendered documents
        uses: actions/upload-artifact@v4
        with:
          name: sop-rendered
          path: out/*.docx
          if-no-files-found: error

      - name: Upload the rendered PDFs
        uses: actions/upload-artifact@v4
        with:
          name: sop-rendered-pdf
          path: out/*.pdf
          if-no-files-found: error

      # A generated branch, not history: it exists so that a reader without a
      # GitHub Actions account can download the current documents by URL. It
      # carries no authority — the Markdown on `main` is the source of record.
      - name: Publish the current documents to the `rendered` branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Rendered documents from ${GITHUB_SHA}"
          git branch -M rendered
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin rendered
