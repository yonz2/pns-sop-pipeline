name: Translate SOP corpus

# The English rendering of the SOP corpus (R1b-translation-pipeline.md).
#
# Separate from the render workflow on purpose. The Indonesian documents are the
# source of record and are rendered mechanically; the English renderings are
# generated by a language model, which is a different kind of step with a
# different failure mode: a model can be unavailable, and its output can fail
# validation. Keeping it separate means a translation outage never blocks the
# source-of-record documents, and the translation pipeline can be re-run on its
# own.
#
# Runs on merge to `main`, and on demand. R1b section 4: it runs on approval,
# not on every save.

on:
  push:
    branches: [main]
    paths:
      - "sop/**"
      - "document-pipeline/**"
      - ".github/workflows/translate.yml"
      - ".github/scripts/translate-main.sh"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Re-translate every procedure, not only what changed"
        type: boolean
        default: false
      dry_run:
        description: "Exercise the pipeline without calling the model (no LLM config needed)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # One translation at a time; a newer push supersedes an in-flight one. The
  # diff base is recorded on the `translated` branch, so a cancelled run is
  # picked up by the next one rather than leaving a document stale.
  group: translate-main
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest
    env:
      # The model is a configuration value (R3 section 8.1), read from repository
      # settings rather than hard-coded. Set these under:
      #   Settings -> Secrets and variables -> Actions
      # LLM_ENDPOINT and LLM_MODEL are variables; LLM_API_KEY is a secret.
      LLM_ENDPOINT: ${{ vars.LLM_ENDPOINT }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}
      PROMPT_VERSION: ${{ vars.PROMPT_VERSION }}
      REVIEWED_BY: ${{ vars.REVIEWED_BY }}
      REVIEW_DATE: ${{ vars.REVIEW_DATE }}
    steps:
      - name: Check out the source of record
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The model endpoint is a department decision (R1b open question 4) and may
      # not be configured yet. On a merge, an unconfigured endpoint warns and
      # skips: the Indonesian source of record is unaffected, and a translation
      # outage must not fail the documents that are actually in force. A manual
      # run is explicit intent, so an unconfigured endpoint there is an error.
      - name: Check the model is configured
        id: model
        env:
          EVENT: ${{ github.event_name }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "${LLM_ENDPOINT:-}" ] && [ -n "${LLM_MODEL:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error title=Model endpoint not configured::Set LLM_ENDPOINT and LLM_MODEL under Settings -> Secrets and variables -> Actions (Variables), and LLM_API_KEY as a secret. To exercise the workflow without a model, run it with 'dry_run' enabled."
            exit 1
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Translation skipped::LLM_ENDPOINT/LLM_MODEL are not configured, so the English renderings were not generated. Set them under Settings -> Secrets and variables -> Actions. The Indonesian documents on main are unaffected."
          fi

      - name: Set up Buildx
        if: ${{ steps.model.outputs.ready == 'true' || inputs.dry_run == true }}
        uses: docker/setup-buildx-action@v3

      - name: Build the pipeline image
        if: ${{ steps.model.outputs.ready == 'true' || inputs.dry_run == true }}
        uses: docker/build-push-action@v6
        with:
          context: document-pipeline
          load: true
          tags: pns-sop-pipeline:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate and validate the English renderings
        if: ${{ steps.model.outputs.ready == 'true' || inputs.dry_run == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCE_FULL: ${{ inputs.force_full }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          force="false"
          [ "$FORCE_FULL" = "true" ] && force="true"
          dry="false"
          [ "$DRY_RUN" = "true" ] && dry="true"
          DRY_RUN="$dry" bash .github/scripts/translate-main.sh \
            "$BEFORE" "$AFTER" pns-sop-pipeline:ci "$force"

      - name: List the English renderings
        if: ${{ steps.model.outputs.ready == 'true' || inputs.dry_run == true }}
        run: ls -l out || true

      - name: Upload the English renderings
        uses: actions/upload-artifact@v4
        if: ${{ steps.model.outputs.ready == 'true' || inputs.dry_run == true }}
        with:
          name: sop-translated
          path: |
            out/*.en.docx
            out/*.en.pdf
            out/HELD.md
          if-no-files-found: warn

      - name: Summarise
        if: always()
        env:
          READY: ${{ steps.model.outputs.ready }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            echo "## Translation"
            echo
            if [ "$READY" != "true" ] && [ "$DRY" != "true" ]; then
              echo "**Skipped** — the model endpoint is not configured."
            elif [ -f out/HELD.md ]; then
              echo "**Some documents were held** — see \`HELD.md\` in the artifact."
            else
              echo "All changed documents translated and validated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
